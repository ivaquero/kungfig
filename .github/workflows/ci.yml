name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: kungfig-linux
            binary_path: target/release/kungfig
          - os: macos-latest
            artifact_name: kungfig-macos
            binary_path: target/release/kungfig
          - os: windows-latest
            artifact_name: kungfig-windows
            binary_path: target/release/kungfig.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
