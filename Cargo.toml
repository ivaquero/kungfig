[package]
name = "kungfig"
version = "0.1.0"
edition = "2024"
description = "A manifest-driven CLI for dotfiles and GUI app configuration management."

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
walkdir = "2.5"
