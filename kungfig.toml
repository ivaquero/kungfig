# Adjust the live-side paths to match your machine.
# Convention:
# - source = live config on your machine
# - target = managed copy inside this repository
# - pull     imports source -> target
# - push     applies target -> source
# - symlink  pulls as a normal copy, then pushes as a symlink

[vars]
# Adjust vault or profile-style variables to match your own machine.
obsidian_vault = "{documents}/Obsidian"
powershell_profile = "{documents}/PowerShell/Microsoft.PowerShell_profile.ps1"

[[items]]
name = "vscode-settings"
id = "vscode"
source.macos = "{appdata}/Code/User/settings.json"
source.linux = "{config}/Code/User/settings.json"
source.windows = "{appdata}/Code/User/settings.json"
target = "{backup}/vscode/settings.json"
mode = "copy"
merge = "json"
tags = ["gui", "editor", "vscode"]
description = "VS Code user settings."

[[items]]
name = "vscode-keybindings"
id = "vscode-keys"
source.macos = "{appdata}/Code/User/keybindings.json"
source.linux = "{config}/Code/User/keybindings.json"
source.windows = "{appdata}/Code/User/keybindings.json"
target = "{backup}/vscode/keybindings.json"
mode = "copy"
merge = "json"
tags = ["gui", "editor", "vscode"]
description = "VS Code keybindings."

[[items]]
name = "vscode-snippets"
id = "vscode-snippets"
source.macos = "{appdata}/Code/User/snippets"
source.linux = "{config}/Code/User/snippets"
source.windows = "{appdata}/Code/User/snippets"
target = "{backup}/vscode/snippets"
mode = "copy"
tags = ["gui", "editor", "vscode"]
description = "VS Code snippets directory."

[[items]]
name = "wezterm"
id = "wezterm"
source.macos = "{config}/wezterm/wezterm.lua"
source.linux = "{config}/wezterm/wezterm.lua"
target = "{backup}/unix/wezterm.lua"
mode = "symlink"
tags = ["terminal", "dotfile"]
description = "Manage WezTerm config as a repo-backed symlink."

[[items]]
name = "zellij"
id = "zellij"
source.macos = "{config}/zellij/config.kdl"
source.linux = "{config}/zellij/config.kdl"
target = "{backup}/unix/zellij.kdl"
mode = "symlink"
tags = ["terminal", "dotfile"]
description = "Manage Zellij config as a repo-backed symlink."

[[items]]
name = "espanso"
id = "espanso"
source.macos = "{appdata}/espanso"
source.linux = "{config}/espanso"
source.windows = "{appdata}/espanso"
target = "{backup}/espanso"
mode = "copy"
tags = ["gui", "text-expander"]
description = "Sync the full Espanso configuration directory."

[[items]]
name = "docker-cli-config"
id = "docker"
source.macos = "{home}/.docker/config.json"
source.linux = "{home}/.docker/config.json"
source.windows = "{home}/.docker/config.json"
target = "{backup}/docker/docker.json"
mode = "copy"
merge = "json"
tags = ["docker", "gui", "cli"]
description = "Docker client config, including credential helper and context settings."

[[items]]
name = "julia-startup"
id = "julia"
source = "{home}/.julia/config/startup.jl"
target = "{backup}/julia/startup.jl"
mode = "symlink"
tags = ["julia", "dotfile"]
description = "Julia startup script."

[[items]]
name = "obsidian-community-plugins"
id = "obsidian-community"
source = "{obsidian_vault}/.obsidian/community-plugins.json"
target = "{backup}/obsidian/community-plugins.json"
mode = "copy"
merge = "json"
tags = ["obsidian", "gui", "vault"]
description = "Enabled Obsidian community plugins for a specific vault."

[[items]]
name = "obsidian-plugins"
id = "obsidian-plugins"
source = "{obsidian_vault}/.obsidian/plugins"
target = "{backup}/obsidian/plugins"
mode = "copy"
tags = ["obsidian", "gui", "vault"]
description = "Installed Obsidian community plugins for a specific vault."

[[items]]
name = "windows-terminal"
id = "wt"
source.windows = "{localconfig}/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"
target = "{backup}/win/terminal.jsonc"
mode = "copy"
tags = ["windows", "terminal", "gui"]
description = "Windows Terminal settings.json."

[[items]]
name = "powershell-profile"
id = "pwsh"
source.windows = "{powershell_profile}"
target = "{backup}/win/Profile.ps1"
mode = "symlink"
tags = ["windows", "shell", "dotfile"]
description = "PowerShell profile script. Adjust powershell_profile in [vars] if needed."
